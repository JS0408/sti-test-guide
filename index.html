<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>금정1터널 STI 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141a20">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 현장 수첩 — 상단 고정 단계 탭, 한 단계 = 시간순 작업 카드 목록, 카드마다 체크·방법·확인 기준
   Look: 야간 터널 — 청회색 콘크리트 바탕, 나트륨등 앰버를 유일한 강조색으로, 머리의 구간 띠(0~240m)가 시그니처 */
:root {
  --bg: #141a20;          /* 터널 벽 청회색 */
  --surface: #1b232b;
  --raised: #232d37;
  --sunken: #10151a;
  --ink: #e6ebef;
  --muted: #8d9caa;
  --line: #2a3540;
  --line-strong: #3a4855;
  --accent: #f3a83b;      /* 나트륨등 앰버 */
  --accent-soft: rgba(243, 168, 59, .13);
  --accent-ink: #ffcf87;
  --on-accent: #2a1a00;
  --warn: #ff7a68;
  --warn-soft: rgba(255, 122, 104, .12);
  --ok: #52d08f;
  --ok-soft: rgba(82, 208, 143, .11);
  --info: #6cc4dc;
  --info-soft: rgba(108, 196, 220, .10);
  --f-display: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r-lg: 14px; --r: 10px; --r-sm: 7px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background:
    radial-gradient(1200px 380px at 50% -160px, rgba(243, 168, 59, .07), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
::selection { background: var(--accent); color: var(--on-accent); }
.wrap { max-width: 880px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.3; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
b, strong { color: var(--ink); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .8rem; color: var(--accent); font-weight: 500; }

/* 머리 */
header.top { padding-block: 36px 22px; display: grid; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .82rem; padding: 4px 11px; border-radius: 999px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.chip b { color: var(--ink); font-weight: 500; }
.lead { color: var(--muted); max-width: 65ch; }
.lead b { color: var(--ink); }

/* 구간 띠: 스피커(앰버 점)·리피터(눈금)·측정 구간 */
.span-strip { margin-top: 4px; }
.span-strip svg { display: block; width: 100%; height: auto; overflow: visible; }
.span-strip .rail { stroke: var(--line-strong); stroke-width: 2; }
.span-strip .zone { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; opacity: .35; }
.span-strip .glow { fill: var(--accent); opacity: .18; }
.span-strip .spk { fill: var(--accent); }
.span-strip .rep { stroke: var(--info); stroke-width: 2; }
.span-strip text { font: 500 11px var(--f-mono); fill: var(--muted); }
.span-strip text.k { font-family: var(--f-display); font-weight: 700; font-size: 12px; fill: var(--accent-ink); }

/* 탭 */
nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: rgba(20, 26, 32, .88);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 6px; padding-block: 10px;
}
nav.tabs button {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font: 500 .9rem var(--f-body); padding: 7px 13px; border-radius: 999px; cursor: pointer;
  display: flex; gap: 7px; align-items: baseline;
  transition: color .15s, border-color .15s, background-color .15s;
}
nav.tabs button:hover { color: var(--ink); border-color: var(--line-strong); }
nav.tabs button small { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); opacity: .8; }
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
nav.tabs button[aria-selected="true"] small { color: var(--accent-ink); opacity: .75; }
nav.tabs button:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.phase { padding-top: 28px; display: grid; gap: 18px; }
.phase-head { display: grid; gap: 6px; }
.phase-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: .9rem; }
.progress { height: 4px; background: var(--raised); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .25s; box-shadow: 0 0 10px rgba(82, 208, 143, .5); }

/* 알림 상자 */
.note { border-radius: var(--r); padding: 14px 16px 14px 18px; display: grid; gap: 8px; border: 1px solid var(--line); border-left-width: 3px; background: var(--surface); }
.note.decide { border-left-color: var(--warn); background: linear-gradient(90deg, var(--warn-soft), transparent 60%), var(--surface); }
.note.decide h3 { color: var(--warn); }
.note.tip { border-left-color: var(--info); background: linear-gradient(90deg, var(--info-soft), transparent 60%), var(--surface); }
.note.tip h3 { color: var(--info); }
.note ul, .note ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.note li::marker { color: var(--muted); }

/* 작업 카드 */
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, background-color .2s; }
.step:hover { border-color: var(--line-strong); }
.step[data-done="true"] { background: var(--ok-soft); border-color: rgba(82, 208, 143, .25); }
.step[data-done="true"] .step-title { text-decoration: line-through; text-decoration-color: var(--ok); color: var(--muted); }
.step-row { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 13px 15px; align-items: start; }
.step input[type="checkbox"] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ok); cursor: pointer; }
.step-body { min-width: 0; display: grid; gap: 6px; }
.step-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.time { font-family: var(--f-mono); font-size: .78rem; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 7px; border-radius: 4px; }
.who { font-size: .8rem; color: var(--muted); }
.step-title { font-weight: 700; font-size: 1rem; cursor: pointer; }
.step details summary { cursor: pointer; color: var(--info); font-size: .86rem; width: fit-content; }
.step details summary:hover { color: var(--ink); }
.how { display: grid; gap: 8px; padding-top: 8px; font-size: .93rem; color: #cfd7de; }
.how ol, .how ul { margin: 0; padding-left: 1.25em; display: grid; gap: 3px; }
.how li::marker { color: var(--muted); }
.check-line { border-left: 2px solid var(--ok); padding-left: 10px; color: var(--ink); }
.check-line b { color: var(--ok); }
.warn-line { border-left: 2px solid var(--warn); padding-left: 10px; }
.warn-line b { color: var(--warn); }

/* 표 */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--raised); color: var(--muted); font-weight: 500; font-size: .82rem; white-space: nowrap; }
tbody tr:hover td { background: rgba(255, 255, 255, .02); }
tr:last-child td { border-bottom: 0; }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent-ink); }
td { word-break: keep-all; overflow-wrap: break-word; }
/* 전체 흐름표: 긴 문장인 「무엇을」에 폭을 몰아 주고 언제·시간 열은 줄바꿈 허용 */
table.flow { table-layout: fixed; }
table.flow .c-when { width: 7.5em; }
table.flow .c-time { width: 9.5em; }
table.flow th, table.flow td.n { white-space: normal; }

/* 역할 */
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.role { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px; display: grid; gap: 5px; align-content: start; }
.role .tag { font-family: var(--f-mono); font-size: .8rem; font-weight: 500; color: var(--on-accent); background: var(--accent); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; }
.role p { font-size: .9rem; color: var(--muted); }

/* 도면 */
.diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.diagram svg { display: block; min-width: 720px; width: 100%; height: auto; }
.diagram .cap { font-size: .82rem; color: var(--muted); padding: 8px 4px 0; }

/* XL2 절차 */
.xl2 { background: linear-gradient(180deg, var(--accent-soft), transparent 140px), var(--surface); border: 1px solid rgba(243, 168, 59, .45); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 12px; }
.xl2 ol { margin: 0; padding-left: 0; list-style: none; counter-reset: x; display: grid; gap: 9px; }
.xl2 li { counter-increment: x; display: grid; grid-template-columns: 30px 1fr; gap: 8px; }
.xl2 li::before { content: counter(x); font-family: var(--f-mono); font-weight: 500; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: .85rem; }

.footer-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
.btn { border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); font: 500 .88rem var(--f-body); padding: 7px 13px; border-radius: var(--r-sm); cursor: pointer; transition: background-color .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn.danger { background: transparent; border-color: rgba(255, 122, 104, .5); color: var(--warn); }
.btn.danger:hover { background: var(--warn-soft); border-color: var(--warn); }

/* 측정 기록 */
.rec { display: grid; gap: 14px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.status { font-size: .88rem; border-radius: var(--r-sm); padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.status.warn { background: var(--warn-soft); border-color: rgba(255, 122, 104, .35); color: var(--warn); }
.status.ok { background: var(--ok-soft); border-color: rgba(82, 208, 143, .3); color: var(--ok); }
.rec-bar { display: grid; gap: 8px; background: rgba(20, 26, 32, .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding-block: 8px; border-bottom: 1px solid var(--line); }
.dist-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.dist-nav button { flex: none; min-width: 44px; min-height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: var(--r-sm); font: 500 .85rem var(--f-mono); cursor: pointer; }
.dist-nav button:hover { color: var(--ink); }
.dist-nav button[data-full="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.dist-nav button[data-some="true"]:not([data-full="true"]) { border-color: var(--accent); color: var(--accent-ink); }
.pt-card { scroll-margin-top: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg .lbl { font-size: .8rem; color: var(--muted); font-weight: 500; min-width: 5.5em; }
.seg button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 500 .92rem var(--f-body); padding: 8px 14px; min-height: 40px; border-radius: var(--r-sm); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; color: var(--muted); font-weight: 500; }
.in { width: 100%; min-width: 0; font: 400 1rem var(--f-body); color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; transition: border-color .15s; }
.in::placeholder { color: #5f6e7b; }
.in:hover { border-color: var(--line-strong); }
.in:focus { border-color: var(--accent); }
.in.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.in[aria-invalid="true"] { border-color: var(--warn); }
.in:disabled { opacity: .5; }
select.in { appearance: auto; }
textarea.in { min-height: 72px; resize: vertical; }
select:focus-visible, textarea:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.pts { display: grid; gap: 10px; }
.pt-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px; display: grid; gap: 10px; }
.pt-card[data-full="true"] { border-color: rgba(82, 208, 143, .55); }
.pt-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.pt-head .d { font-family: var(--f-mono); font-size: 1.25rem; font-weight: 500; color: var(--accent-ink); }
.pt-head .ref { color: var(--muted); font-size: .88rem; }
.pt-head .cnt { margin-left: auto; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.pt-card[data-full="true"] .cnt { color: var(--ok); }
.pos-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pos { display: grid; gap: 5px; align-content: start; min-width: 0; }
.pos-h { font-size: .8rem; font-weight: 500; color: var(--muted); }
.pos .in { text-align: center; padding: 8px 4px; }
.avg { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .95rem; text-align: center; padding: 4px; border-radius: 6px; background: var(--raised); }
.avg[data-fail="true"] { color: var(--warn); background: var(--warn-soft); }
.avg small { font-family: var(--f-body); color: var(--muted); font-size: .72rem; margin-right: 4px; }
.flag { font-size: .74rem; color: var(--warn); line-height: 1.35; }
.pt-extra { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: end; }
label.btn { display: inline-flex; align-items: center; gap: 6px; position: relative; white-space: nowrap; }
label.btn.on { border-color: var(--accent); }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.thumbs:empty { display: none; }
.ph { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: var(--r-sm); overflow: hidden; background: var(--sunken); border: 1px solid var(--line); padding: 0; cursor: pointer; color: var(--muted); font-size: .75rem; }
.thumbs .ph { width: 60px; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph span { position: absolute; inset: auto 0 0 0; font-size: .72rem; padding: 2px 6px; background: rgba(0, 0, 0, .6); color: #fff; text-align: left; }
.photo-sec { display: grid; gap: 10px; }
.photo-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.photo-head h3 { margin-right: auto; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.empty { color: var(--muted); font-size: .9rem; }
.gallery .empty { grid-column: 1 / -1; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(8, 11, 14, .95); display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; min-height: 0; border-radius: var(--r-sm); }
.lb-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--ink); font-size: .9rem; }
.lb-bar .cap { margin-right: auto; }
.lb-bar .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.lb-val { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.lb-val .in { width: 6.5em; }
.slot { display: grid; grid-template-columns: 38px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 6px; align-items: center; text-align: left;
  min-height: 52px; padding: 6px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; border-radius: var(--r-sm); border: 1px dashed var(--line-strong); background: var(--sunken); color: var(--ink); font: 500 .85rem var(--f-body); cursor: pointer; transition: border-color .15s; }
.slot:hover { border-color: var(--muted); }
.slot-img { grid-row: 1 / 3; width: 38px; height: 38px; border-radius: 5px; background: var(--raised) center / cover no-repeat; }
.slot-t { font-weight: 700; }
.slot-s { font-size: .74rem; color: var(--muted); font-family: var(--f-mono); }
.slot[data-has="true"] { border-style: solid; border-color: rgba(82, 208, 143, .6); background: var(--ok-soft); }
.slot[data-has="true"] .slot-s { color: var(--ok); font-weight: 500; }
.slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pt-extra .slot { min-width: 110px; }
.add-dist { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 12px 14px; }
.add-dist .status { grid-column: 1 / -1; }
.add-dist .btn { min-height: 44px; }
.tag-add { font-size: .72rem; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
.del-d { padding: 4px 10px; font-size: .8rem; }
.send { background: linear-gradient(180deg, var(--accent-soft), transparent 160px), var(--surface); border: 1px solid rgba(243, 168, 59, .45); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 12px; }
.send .field { max-width: 22rem; }
.send-sum { font-size: .9rem; color: var(--muted); }
.send-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.clear-row { padding-top: 10px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; padding: 10px 16px; }
.btn.primary:hover { background: #ffb954; border-color: #ffb954; }
.btn:disabled { opacity: .5; cursor: wait; }
@media (max-width: 640px) {
  nav.tabs { position: static; gap: 5px; }
  .rec-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; }
  nav.tabs button { padding: 8px 11px; min-height: 40px; font-size: .88rem; }
  nav.tabs button small { display: none; }
  .rec-bar { grid-template-columns: 1fr 1fr; gap: 6px; padding-block: 6px; }
  .rec-bar .dist-nav { grid-column: 1 / -1; }
  .seg { flex-wrap: nowrap; gap: 4px; }
  .seg .lbl { display: none; }
  .seg button { flex: 1; padding: 6px 4px; font-size: .85rem; white-space: nowrap; }
  .pos-grid { gap: 6px; }
  .pt-card { padding: 10px; gap: 8px; }
  .slot { grid-template-columns: 1fr; grid-template-rows: auto auto auto; justify-items: center; text-align: center; row-gap: 2px; padding: 6px 4px; }
  .slot-img { grid-row: auto; width: 44px; height: 44px; }

<template id="tpl-record">

<template id="tpl-overview">
  <div class="note tip">
    <h3>시험 목적</h3>
    <p>스피커를 <b>100m 간격</b>으로만 설치해도(50·150m는 리피터 앰프만) 위치별 평균 STI <b class="num">0.46</b> 이상이 나오는지 확인. TS 스피커 + 압축드라이버 100W / 300W 두 조합 비교.</p>
  </div>

  <div class="note decide">
    <h3>출발 전 결정</h3>
    <ul>
      <li><b>좌·중·우 기준</b>: 예) 왼쪽 차로 끝 / 중앙선 / 오른쪽 차로 끝. 전 거리 동일하게</li>
      <li><b>볼륨 기준</b>: 전 조합 고정 또는 조합마다 1m 음압 일치</li>
      <li><b>교통 통제 · 작업 허가</b>: 차로 차단, 작업 시간, 신호수</li>
      <li><b>설치 후 장비 보관</b>: 터널에 두기 또는 철수 후 재설치</li>
      <li><b>입회 범위</b>: 2조합 전체 또는 일부</li>
    </ul>
  </div>

  <h3>전체 흐름</h3>
  <div class="tbl-wrap"><table class="flow">

    <thead><tr><th>언제</th><th>무엇을</th><th>소요 시간</th></tr></thead>

      <tr><td class="n">10/30 오후</td><td>입회시험 (오전과 동일)</td><td class="n">1~2시간</td></tr>

    </tbody>
  </table></div>
  <p class="lead">지점당 약 1.5분 → 조합당 약 1시간. 08:30 시작 시 11시 전후 종료.</p>

<template id="tpl-xl2">
  <div class="xl2">
    <h3>한 지점 측정 (반복)</h3>
    <ol>
      <li><p><b>마이크 세우기</b>: 분필 표시 위, 높이 1.2~1.6m (전 지점 동일)</p></li>
      <li><p><b>1~2m 물러나기</b>: 옆으로 비켜서고 정숙</p></li>
      <li><p><b>측정 시작</b>: 15~25초. 차량·말소리가 있으면 다시</p></li>
      <li><p><b>결과 화면 촬영</b>: 해당 칸(예: 10m 중앙 1차) 누르기 → STI 숫자가 크게, 반사 없이</p></li>
      <li><p><b>2차 측정</b>: 차이 0.03 초과면 3차</p></li>
      <li><p><b>XL2 저장</b> (가능 시): 예 <span class="num">TS-100_010m_C_1</span></p></li>
    </ol>
    <p class="check-line"><b>정상 범위:</b> 스피커 앞(1·101·201m) 높음, 40m 앞(40·140·240m) 낮음. 튀는 값은 소음·마이크 위치 확인.</p>
    <p class="check-line"><b>판정:</b> 위치별 평균 STI <span class="num">0.46</span> 이상 합격. 근처 값이면 3차까지.</p>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>구분</th><th>순서</th></tr></thead>
    <tbody>

// ── 측정 기록: 칸마다 XL2 화면 사진(IndexedDB), 머리 정보·선택 입력값은 localStorage. 모두 이 휴대폰에만. [기록 보내기]로 엑셀 기록지+사진 ZIP ──
// 기본 측정 거리(계획). 현장에서 [+ 거리 추가]로 늘릴 수 있고, 추가한 거리는 이 폰의 기록지 4장 모두에 생김

// 기본 + 추가 + (혹시 남아 있는) 사진·입력값의 거리
function allDists() {

const $ = id => document.getElementById(id);
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function deepMerge(t, s) {
  for (const [k, v] of Object.entries(s)) t[k] = isObj(v) ? deepMerge(isObj(t[k]) ? t[k] : {}, v) : v;
  return t;
}
// '' → null, 숫자가 아니면 undefined(저장 안 함)
function toNum(v) {
  v = String(v).trim().replace(',', '.');
  if (v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : undefined;
}
const fmt = (n, d) => (typeof n === 'number' ? n.toFixed(d) : '');
const isNum = x => typeof x === 'number';
const PASS_STI = 0.46;   // 판정 기준: 평균 STI 0.46 이상 합격
// 한 위치의 평균: 입력된 1·2·3차 값 모두의 평균
function posStats(row, p) {
  const v = [1, 2, 3].map(n => row[p + n]);
  const nums = v.filter(isNum);
  const avg = nums.length ? Math.round(nums.reduce((a, b) => a + b, 0) / nums.length * 100) / 100 : null;
  let flag = '';
  if (nums.some(x => x < 0 || x > 1)) flag = 'STI는 0~1 사이입니다';
  else if (isNum(v[0]) && isNum(v[1]) && Math.abs(v[0] - v[1]) > 0.03 + 1e-9 && !isNum(v[2])) flag = `차이 ${Math.abs(v[0] - v[1]).toFixed(2)} · 3차 측정`;
  return { v, avg, flag, full: isNum(v[0]) && isNum(v[1]) };
}

// ── IndexedDB (사진) ──
function idbOpen() {
  return new Promise((ok, no) => {
    const r = indexedDB.open('sti-rec', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
function idbDo(mode, fn) {
  return new Promise((ok, no) => {
    const tx = rec.idb.transaction('photos', mode);
    const req = fn(tx.objectStore('photos'));
    tx.oncomplete = () => ok(req && req.result);
    tx.onerror = () => no(tx.error);
    tx.onabort = () => no(tx.error);
  });
}
const photoUrl = ph => rec.urls[ph.id] || (rec.urls[ph.id] = URL.createObjectURL(new Blob([ph.buf], { type: ph.type })));

      const got = [1, 2, 3].map(n => paint(d, p + n, row[p + n], 2));
      const st = posStats(row, p);
      const a = $(`a-${d}-${p}`);
      a.hidden = st.avg == null;
      a.replaceChildren(el('small', { text: '평균' }), st.avg == null ? '' : st.avg.toFixed(2));
      a.dataset.fail = String(st.avg != null && st.avg < PASS_STI);
      $(`f-${d}-${p}`).textContent = st.flag;
      if (got.some(Boolean)) full++;   // 1~3회 중 몇 번이든 찍었으면 측정한 위치로 셈
    });
    paint(d, 'spl', row.spl, 1);
    setVal($('n-' + d), row.note);
    $('c-' + d).textContent = `${full}/3`;
    $('pt-' + d).dataset.full = String(full === 3);
    $('dn-' + d).dataset.full = String(full === 3);
    $('dn-' + d).dataset.some = String(full > 0);
  });
  renderStatus();
  renderSend();
}

// ── 사진: 긴 변 1600px JPEG로 줄여서 IndexedDB에 보관 ──
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((ok, no) => c.toBlob(b => (b ? ok(b) : no(new Error('encode'))), 'image/jpeg', 0.85));
  } catch (e) { return file; }
}
async function storePhoto(file, meta) {
  const blob = await shrink(file);
  const ph = Object.assign({ at: new Date().toISOString(), type: blob.type || 'image/jpeg', buf: await blob.arrayBuffer() }, meta);
  ph.id = await idbDo('readwrite', st => st.add(ph));
  rec.photos.push(ph);
  notifyTabs();
  return ph;
}
async function addShot(t, file) {
  if (!rec.idb) { photoStatus('이 브라우저에서는 사진을 저장할 수 없습니다. 일반 창에서 다시 열어 주세요.', 'warn'); return; }
  rec.busy++; renderPhotos();
  try {
    const old = findShot(t.sheet, t.d, t.slot);
    await storePhoto(file, { sheet: t.sheet, d: t.d, slot: t.slot });
    if (old) await removePhoto(old);   // 다시 찍기: 새 사진이 저장된 뒤에 예전 사진을 지움
  } catch (e) { photoStatus('사진을 저장하지 못했습니다. 휴대폰 저장 공간을 확인하세요.', 'warn'); }
  rec.busy--;
  dropZip(); renderRec(); renderPhotos();
}
async function addPhotos(files) {
  if (!rec.idb) { photoStatus('이 브라우저에서는 사진을 저장할 수 없습니다. 일반 창에서 다시 열어 주세요.', 'warn'); return; }
  let fail = 0;
  for (const f of files) {
    rec.busy++; renderPhotos();
    try { await storePhoto(f, { sheet: sheetId(), d: '', slot: '' }); } catch (e) { fail++; }
    rec.busy--;
  }
  dropZip(); renderPhotos(); renderSend();
  if (fail) photoStatus(`사진 ${fail}장을 저장하지 못했습니다. 휴대폰 저장 공간을 확인하세요.`, 'warn');
}
async function removePhoto(ph) {
  await idbDo('readwrite', st => st.delete(ph.id));
  rec.photos = rec.photos.filter(p => p !== ph);

  if (rec.urls[ph.id]) { URL.revokeObjectURL(rec.urls[ph.id]); delete rec.urls[ph.id]; }
}

function loadLib(src, name) {
  if (window[name]) return Promise.resolve();
  return new Promise((ok, no) => { const s = el('script', { src }); s.onload = ok; s.onerror = no; document.head.append(s); });
}
const photoExt = ph => (/png/.test(ph.type) ? 'png' : /webp/.test(ph.type) ? 'webp' : 'jpg');
const photoName = (ph, i) => ph.slot
  ? `${ph.sheet}_${String(ph.d).padStart(3, '0')}m_${ph.slot === 'spl' ? 'SPL' : ph.slot[0] + '_' + ph.slot[1]}.${photoExt(ph)}`
  : `${ph.sheet}_etc_${String(i + 1).padStart(3, '0')}.${photoExt(ph)}`;

function buildSheet(wb, c, k, idx, sender, names) {
  const [cid, clabel, watt] = c, [kid, klabel] = k;
  const data = rec.sheets[`${cid}-${kid}`] || {}, m = data.meta || {}, pts = data.pts || {};
  const ws = wb.addWorksheet(`${clabel.replace(/\s/g, '')} ${klabel}`, {
    pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 1, margins: { left: .4, right: .4, top: .5, bottom: .5, header: .2, footer: .2 } },
  });
  ws.columns = [8, 11, 7, 7, 7, 7, 7, 7, 7, 7, 7, 10, 24].map(width => ({ width }));
  const thin = { style: 'thin', color: { argb: 'FF7F8C8D' } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const head = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9ECEF' } };
  const avgFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF4F6F7' } };
  const warnFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFBE5E0' } };
  const font = { name: '맑은 고딕', size: 10 };
  const put = (ref, value, o = {}) => {
    const cell = ws.getCell(ref);
    cell.value = value === '' || value == null ? null : value;
    cell.font = Object.assign({}, font, o.font);
    cell.alignment = Object.assign({ vertical: 'middle', horizontal: 'center', wrapText: true }, o.align);
    if (o.border !== false) cell.border = box;
    if (o.fill) cell.fill = o.fill;
    if (o.fmt) cell.numFmt = o.fmt;
    return cell;
  };
  const merge = (range, value, o) => { ws.mergeCells(range); put(range.split(':')[0], value, o); if (o && o.border !== false || !o) range.split(':').length && styleRange(range, o); };
  function styleRange(range, o = {}) {
    if (o.border === false) return;
    const [a, b] = range.split(':');
    const ca = ws.getCell(a), cb = ws.getCell(b);
    for (let r = ca.row; r <= cb.row; r++) for (let col = ca.col; col <= cb.col; col++) {
      const cell = ws.getCell(r, col); cell.border = box; if (o.fill) cell.fill = o.fill;
    }
  }

  merge('A1:M1', `STI 측정 기록지 (${idx}/4)  ·  ${clabel}  ·  ${klabel}`, { font: { size: 14, bold: true }, border: false });
  merge('A2:M2', '강진광주선 금정1터널  ·  측정장비 NTi XL2 (STIPA)  ·  스피커 0·100·200m(SP1·SP2·SP3), 리피터 앰프 50·150m  ·  1~240m 구간 좌·중·우 측정', { font: { size: 9, color: { argb: 'FF5B646B' } }, border: false });
  ws.getRow(1).height = 26;
  const info = [
    [4, ['스피커', 'TS'], ['압축드라이버', watt], ['측정 일시', m.when]],
    [5, ['측정자', m.who], ['음원 입력', m.input], ['STIPA 판', m.ed]],
    [6, ['배경소음 dB(A)', isNum(m.bg) ? m.bg : null], ['구분', klabel], ['보낸 사람', sender]],
  ];
  info.forEach(([r, ...pairs]) => {
    const spans = [['A', 'B', 'C', 'D'], ['E', 'F', 'G', 'H'], ['I', 'J', 'K', 'M']];
    pairs.forEach(([label, val], i) => {
      const [l1, l2, v1, v2] = spans[i];
      merge(`${l1}${r}:${l2}${r}`, label, { fill: head, font: { bold: true } });
      merge(`${v1}${r}:${v2}${r}`, val, { fmt: label.startsWith('배경') ? '0.0' : undefined });
    });
    ws.getRow(r).height = 20;
  });

  merge('A8:A9', '거리(m)', { fill: head, font: { bold: true } });
  merge('B8:B9', '기준 위치', { fill: head, font: { bold: true } });
  merge('C8:E8', '우측 STI', { fill: head, font: { bold: true } });
  merge('F8:H8', '중앙 STI', { fill: head, font: { bold: true } });
  merge('I8:K8', '좌측 STI', { fill: head, font: { bold: true } });
  merge('L8:L9', '음압 dB(A)', { fill: head, font: { bold: true } });
  merge('M8:M9', '비고', { fill: head, font: { bold: true } });
  ['C', 'F', 'I'].forEach(col0 => {
    const c0 = ws.getColumn(col0).number;
    ['1차', '2차', '평균'].forEach((t, i) => put(ws.getCell(9, c0 + i).address, t, { fill: head, font: { bold: true } }));
  });

  const linkOr = (ref, val, d, slot, o) => {
    const ph = findShot(`${cid}-${kid}`, d, slot);
    if (isNum(val) || !ph) return put(ref, isNum(val) ? val : null, o);
    const cell = put(ref, { text: '사진', hyperlink: 'photos/' + names.get(ph) }, Object.assign({}, o, { font: { color: { argb: 'FF2B5F8A' }, underline: true } }));
    cell.numFmt = undefined;
    return cell;
  };
  const rows = distRows();
  rows.forEach(([d, ref], i) => {
    const r = 10 + i, row = pts[d] || {};
    put(`A${r}`, d, { font: { bold: true } });
    put(`B${r}`, DEF_DISTS.includes(d) ? ref : ref + ' (추가)');
    const third = [];
    POS.forEach(([p, pl], j) => {
      const st = posStats(row, p);
      const c0 = 3 + j * 3;
      const fill = st.flag ? warnFill : undefined;
      linkOr(ws.getCell(r, c0).address, st.v[0], d, p + '1', { fmt: '0.00', fill });
      linkOr(ws.getCell(r, c0 + 1).address, st.v[1], d, p + '2', { fmt: '0.00', fill });
      put(ws.getCell(r, c0 + 2).address, st.avg, { fmt: '0.00', fill: avgFill, font: { bold: true, color: { argb: st.avg != null && st.avg < PASS_STI ? 'FFC2412D' : 'FF1D2327' } } });
      if (isNum(st.v[2])) third.push(`${pl[0]} 3차 ${st.v[2].toFixed(2)}`);
      else if (findShot(`${cid}-${kid}`, d, p + '3')) third.push(`${pl[0]} 3차 사진`);
    });
    linkOr(`L${r}`, row.spl, d, 'spl', { fmt: '0.0' });
    put(`M${r}`, [third.join(', '), row.note].filter(Boolean).join(' / '), { align: { horizontal: 'left' }, font: { size: 9 } });
    ws.getRow(r).height = 24;
  });

  const F = 10 + rows.length + 1;
  merge(`A${F}:M${F}`, '※ 거리는 시작점(SP1) 기준이며, (추가)는 현장에서 추가한 거리입니다. 지점마다 2회 측정하고, 두 값의 차이가 0.03을 넘으면 한 번 더 측정해 비고에 적습니다. 지점마다 1~3회 측정할 수 있으며 빈칸은 측정하지 않은 회차입니다. 「사진」을 누르면 photos 폴더의 XL2 화면 사진이 열립니다(ZIP을 푼 뒤). 값이 입력된 칸은 숫자로 표시하고, 평균은 입력된 값의 평균입니다. 판정 기준: 평균 STI 0.46 이상 합격(미만은 빨간 글씨).', { font: { size: 9 }, align: { horizontal: 'left' }, border: false });
  ws.getRow(F).height = 30;
  merge(`A${F + 1}:B${F + 3}`, '특이사항', { fill: head, font: { bold: true } });
  merge(`C${F + 1}:M${F + 3}`, m.notes, { align: { horizontal: 'left', vertical: 'top' } });
}

function buildPhotoSheet(wb, names) {
  const ws = wb.addWorksheet('사진 목록');
  ws.columns = [{ header: '파일 이름 (photos 폴더)', key: 'f', width: 32 }, { header: '기록지', key: 's', width: 18 }, { header: '거리(m)', key: 'd', width: 9 }, { header: '칸', key: 'k', width: 10 }, { header: '직접 넣은 값', key: 'v', width: 12 }, { header: '찍은 시각', key: 't', width: 20 }];
  ws.getRow(1).font = { name: '맑은 고딕', size: 10, bold: true };
  rec.photos.forEach(ph => {
    const v = ph.slot ? ((((rec.sheets[ph.sheet] || {}).pts || {})[ph.d] || {})[ph.slot]) : null;
    const row = ws.addRow({ f: { text: names.get(ph), hyperlink: 'photos/' + names.get(ph) }, s: sheetLabel(ph.sheet), d: ph.d ? Number(ph.d) : '', k: ph.slot ? slotLabel(ph.slot) : '기타', v: isNum(v) ? v : '', t: new Date(ph.at).toLocaleString('ko-KR') });
    row.getCell('f').font = { color: { argb: 'FF2B5F8A' }, underline: true };
  });
}

async function makeZip() {
  const btn = $('zip-make');
  btn.disabled = true;
  if (rec.busy) { btn.disabled = false; sendStatus('사진을 저장하는 중입니다. 잠시 뒤 다시 눌러 주세요.', 'warn'); return; }
  await reloadStore();   // 다른 탭에서 바뀐 내용까지 반영한 최신 기록으로 만듦
  sendStatus('파일을 만드는 중입니다…');
  try {
    await Promise.all([loadLib('lib/exceljs.min.js', 'ExcelJS'), loadLib('lib/jszip.min.js', 'JSZip')]);
  } catch (e) {
    btn.disabled = false;
    sendStatus('엑셀 도구를 불러오지 못했습니다. 인터넷이 되는 곳에서 이 페이지를 한 번 새로 고침한 뒤 다시 눌러 주세요.', 'warn');
    return;
  }
  try {
    const sender = $('sender').value.trim();
    const wb = new ExcelJS.Workbook();
    wb.creator = sender || 'STI 시험 가이드';
    const names = new Map(rec.photos.map((ph, i) => [ph, photoName(ph, i)]));
    let idx = 0;
    KINDS.forEach(k => COMBOS.forEach(c => buildSheet(wb, c, k, ++idx, sender, names)));
    buildPhotoSheet(wb, names);
    const zip = new JSZip();
    const now = new Date();
    const p2 = n => String(n).padStart(2, '0');
    const stamp = `${p2(now.getMonth() + 1)}${p2(now.getDate())}-${p2(now.getHours())}${p2(now.getMinutes())}`;
    zip.file(`STI_measurement_${stamp}.xlsx`, await wb.xlsx.writeBuffer());
    zip.file('records.json', JSON.stringify({
      sender, exportedAt: now.toISOString(), dists: allDists(), defaultDists: DEF_DISTS, sheets: rec.sheets,
      photos: rec.photos.map(ph => ({ file: 'photos/' + names.get(ph), sheet: ph.sheet, d: ph.d, slot: ph.slot || '', at: ph.at })),
    }, null, 2));
    rec.photos.forEach(ph => zip.file('photos/' + names.get(ph), ph.buf));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const safe = (sender || '이름없음').replace(/[\\/:*?"<>|\s]+/g, '_');
    rec.zip = new File([blob], `STI기록_${safe}_${stamp}.zip`, { type: 'application/zip' });
    const mb = (blob.size / 1048576).toFixed(1);
    sendStatus(`파일이 준비됐습니다: ${rec.zip.name} (${mb} MB). ${canShareFile(rec.zip) ? '위의 [카톡·메일로 보내기] 또는 [파일로 저장]을 누르세요.' : '위의 [파일로 저장]을 누른 뒤 카톡이나 메일에 첨부해 보내세요.'}`, 'ok');
  } catch (e) {
    sendStatus('파일을 만들지 못했습니다. 다시 눌러 주세요.', 'warn');
  } finally {
    btn.disabled = false; renderSend();
  }
}
function markSent() { try { localStorage.setItem(LKEY, new Date().toISOString()); } catch (e) {} renderSend(); }
async function shareZip() {
  try {
    await navigator.share({ files: [rec.zip], title: 'STI 측정 기록' });
    markSent(); sendStatus('보냈습니다. 받는 사람이 ZIP 파일을 받았는지 확인하세요.', 'ok');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    $('zip-share').hidden = true;
    sendStatus('보내기 창을 열지 못했습니다. [파일로 저장]을 누른 뒤 카톡이나 메일에 직접 첨부해 주세요.', 'warn');
  }
}
function saveZip() {
  const a = el('a', { href: URL.createObjectURL(rec.zip), download: rec.zip.name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  markSent(); sendStatus('다운로드 폴더에 저장했습니다. 카톡이나 메일에 첨부해 보내세요.', 'ok');
}

async function initRecord() {
  buildRecord(); renderRec(); renderPhotos();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try {
    rec.idb = await idbOpen();
    rec.photos = ((await idbDo('readonly', st => st.getAll())) || []).sort((a, b) => (a.at < b.at ? -1 : 1));
  } catch (e) { rec.idb = null; rec.idbOk = false; }
  buildDists();   // 사진에만 남아 있는 거리가 있으면 카드를 만듦
  renderRec(); renderPhotos();
  // 오프라인에서도 열리도록 페이지와 도구를 폰에 보관
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
      .then(() => { rec.offline = 'ready'; renderStatus(); })
      .catch(() => { rec.offline = 'no'; renderStatus(); });
  } else { rec.offline = 'no'; renderStatus(); }
}
initRecord();
</script>
